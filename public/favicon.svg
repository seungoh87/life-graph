<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 배경 -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <rect width="64" height="64" rx="14" fill="#f8f9ff"/>

  <!-- 그래프 선 (빨강: 양수 구간) -->
  <polyline
    points="6,48 18,20 30,36"
    fill="none" stroke="#f6465d" stroke-width="4.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 그래프 선 (파랑: 음수 구간) -->
  <polyline
    points="30,36 38,44"
    fill="none" stroke="#2196f3" stroke-width="4.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 그래프 선 (빨강: 다시 양수) -->
  <polyline
    points="38,44 58,18"
    fill="none" stroke="#f6465d" stroke-width="4.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 제로 라인 -->
  <line x1="4" y1="40" x2="60" y2="40" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- 포인트 -->
  <circle cx="18" cy="20" r="4" fill="white" stroke="#f6465d" stroke-width="2.5"/>
  <circle cx="38" cy="44" r="4" fill="white" stroke="#2196f3" stroke-width="2.5"/>
  <circle cx="58" cy="18" r="4" fill="white" stroke="#f6465d" stroke-width="2.5"/>
</svg>
